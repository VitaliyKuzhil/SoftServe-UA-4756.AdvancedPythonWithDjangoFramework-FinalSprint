{% extends 'base.html' %}
{% block title %}Update an Author{% endblock %}
{% block content %}

 <div class="container">
        {% if user.is_staff %}
        <form class="card" method="POST" action="{% url 'author:update_an_author' author.id %}">
        <div class="d-flex justify-content-center">
            <h3>Update An Author</h3>
        </div>
        <div class="form-group m-5 mt-2 mb-2">
            {% csrf_token %}
            {{ form.as_p }}
        </div>
        <button type="submit" class="btn btn-primary btn-block">Update an Author</button>
    </form>
    {% endif %}
</div>
