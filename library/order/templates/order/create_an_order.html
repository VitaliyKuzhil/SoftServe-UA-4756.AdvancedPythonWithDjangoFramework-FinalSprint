{% extends 'base.html' %}
{% block title %}New Order{% endblock %}
{% block content %}

<div class="container">
    <form class="card" id="createAnOrderForm" method="POST" action="{% url 'create_an_order' %}">
        <div class="d-flex justify-content-center">
            <h3>Create an Order</h3>
        </div>
        <div class="form-group m-5 mt-2 mb-2">
            {% csrf_token %}
            <div class="form-group">
                <label for="{{ form.book.id_for_label }}" class="form-label fw-bold d-block">
                    {{ form.book.label }}
                </label>

                {{ form.book }}
            </div>

            <div class="form-group">
                <label for="{{ form.copies.id_for_label }}">Copies</label>
                {{ form.copies }}
            </div>

            {% if form.non_field_errors %}
            <div class="alert alert-danger mt-2">
                {% for error in form.non_field_errors %}
                <span class="error-message text-danger d-block">{{ error }}</span>
                {% endfor %}
            </div>
            {% endif %}
        </div>

        <button type="submit" class="btn btn-primary btn-block">Create an Order</button>
    </form>
</div>
